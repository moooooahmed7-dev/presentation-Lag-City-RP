<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التقديم - Lag City RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #14161a; color: #e0e6ed; font-family: 'Cairo', sans-serif; direction: rtl; padding: 20px; font-size: 14px; }
        .form-container { max-width: 800px; margin: 0 auto; }
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-titles { display: flex; align-items: center; gap: 15px; }
        .form-header h2 { color: #e03030; margin: 0; }
        .join-discord-btn { background-color: #5865F2; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.2s; }
        .join-discord-btn:hover { background-color: #4752c4; }
        .logo-placeholder { width: 50px; height: 50px; background-color: #2c3038; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .form-row { margin-bottom: 20px; }
        .form-row.duo { display: flex; gap: 20px; }
        .form-row.duo .form-group { flex: 1; }
        .form-group label { display: block; margin-bottom: 8px; color: #a1aab3; font-weight: 600; }
        input[type="text"], textarea, .custom-select select { width: 100%; background-color: #1e2128; border: 1px solid #2c3038; color: #fff; padding: 12px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 14px; }
        textarea { resize: none; height: 100px; }
        input::placeholder, textarea::placeholder { color: #4f5963; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #e03030; }
        .custom-select { position: relative; }
        .custom-select::after { content: '▼'; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #4f5963; font-size: 10px; }
        .custom-select select { appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer; }
        .discord-section { margin-top: 30px; margin-bottom: 30px; background-color: #1e2128; padding: 20px; border-radius: 8px; border: 1px solid #2c3038; }
        .discord-input { position: relative; display: flex; }
        .discord-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #e03030; width: 20px; height: 20px; }
        .discord-input input { padding-right: 45px; }
        .checkbox-group { margin-top: 15px; display: flex; align-items: flex-start; gap: 10px; }
        .checkbox-group input { margin-top: 3px; accent-color: #e03030; cursor: pointer; }
        .checkbox-group label { font-size: 13px; color: #a1aab3; line-height: 1.6; }
        .form-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; }
        .form-actions button { padding: 12px 30px; border-radius: 8px; border: none; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-back { background-color: #2c3038; color: #e0e6ed; }
        .btn-submit { background-color: #e03030; color: #fff; }
        .red-bg { background-color: #e03030 !important; }

        @media (max-width: 600px) {
            .form-row.duo { flex-direction: column; gap: 0; }
            .header-titles { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <div class="header-titles">
                <h2>Lag City RP</h2>
                <a href="https://discord.gg/sregwwRJp" target="_blank" class="join-discord-btn">
                    <svg width="20" height="20" viewBox="0 0 127.14 96.36"><path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.85,105.85,0,0,0,19.44,8.07C2.79,32.64-1.65,56.46.61,80.21a103.82,103.82,0,0,0,31.22,16.6A79.41,79.41,0,0,0,40.66,85a51.13,51.13,0,0,1-8.13-4c.54-.36,1.07-.74,1.59-1.13A59.75,59.75,0,0,0,73.52,80c.52.39,1.05.77,1.59,1.13a51.53,51.53,0,0,1-8.13,4,79.14,79.14,0,0,0,10,11.81A103.89,103.89,0,0,0,108.56,80C111.13,55.62,106.62,31.77,107.7,8.07ZM42.46,65.62C36.18,65.62,31,60,31,53.13s5.18-12.49,11.46-12.49c6.28,0,11.46,5.63,11.46,12.49S48.74,65.62,42.46,65.62Zm42.29,0C78.48,65.62,73.3,60,73.3,53.13s5.18-12.49,11.46-12.49c6.28,0,11.46,5.63,11.46,12.49S89,65.62,84.75,65.62Z"></path></svg>
                    دخول سيرفر الديسكورد
                </a>
            </div>
            <div class="logo-placeholder">LC</div>
        </div>

        <form id="application-form">
            <div class="form-row duo">
                <div class="form-group">
                    <label>العمر</label>
                    <input type="text" id="age" placeholder="العمر" required>
                </div>
                <div class="form-group">
                    <label>الاسم الحقيقي</label>
                    <input type="text" id="realName" placeholder="الاسم الحقيقي" required>
                </div>
            </div>

            <div class="form-row duo">
                <div class="form-group">
                    <label>عدد ساعات SAMP</label>
                    <input type="text" id="sampHours" placeholder="عدد ساعات SAMP" required>
                </div>
                <div class="form-group">
                    <label>هل لعبت رول بلاي من قبل؟</label>
                    <div class="custom-select">
                        <select id="rpExperience" required>
                            <option value="">اختر إجابة</option>
                            <option value="نعم">نعم</option>
                            <option value="لا">لا</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>اسم الشخصية</label>
                    <input type="text" id="charName" placeholder="اسم الشخصية" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>قصة الشخصية</label>
                    <textarea id="charStory" placeholder="قصة الشخصية" required></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>لماذا تريد الانضمام إلينا؟</label>
                    <textarea id="whyJoin" placeholder="لماذا تريد الانضمام إلينا؟" required></textarea>
                </div>
            </div>

            <div class="discord-section">
                <div class="form-row">
                    <label>DISCORD TAG (مثال: username#1234 أو @username)</label>
                    <div class="discord-input">
                        <span class="discord-icon">
                            <svg viewBox="0 0 127.14 96.36"><path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.85,105.85,0,0,0,19.44,8.07C2.79,32.64-1.65,56.46.61,80.21a103.82,103.82,0,0,0,31.22,16.6A79.41,79.41,0,0,0,40.66,85a51.13,51.13,0,0,1-8.13-4c.54-.36,1.07-.74,1.59-1.13A59.75,59.75,0,0,0,73.52,80c.52.39,1.05.77,1.59,1.13a51.53,51.53,0,0,1-8.13,4,79.14,79.14,0,0,0,10,11.81A103.89,103.89,0,0,0,108.56,80C111.13,55.62,106.62,31.77,107.7,8.07ZM42.46,65.62C36.18,65.62,31,60,31,53.13s5.18-12.49,11.46-12.49c6.28,0,11.46,5.63,11.46,12.49S48.74,65.62,42.46,65.62Zm42.29,0C78.48,65.62,73.3,60,73.3,53.13s5.18-12.49,11.46-12.49c6.28,0,11.46,5.63,11.46,12.49S89,65.62,84.75,65.62Z"></path></svg>
                        </span>
                        <input type="text" id="discordTag" placeholder="Discord Tag" required>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rules" required>
                    <label for="rules">
                        لقد قرأت قوانين السيرفر بالكامل، وأتعهد بالالتزام بها وبقرارات الإدارة.
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-back" onclick="window.location.reload();">تفريغ الحقول</button>
                <button type="submit" class="btn-submit red-bg" id="submit-btn">إرسال الطلب إلى Lag City RP</button>
            </div>
        </form>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1534284622085492887/-HmQRssHqL4hm34IUSHAudk74OseFhM-eRmgG6WgWXa6nCgFEpuUftPBckBsgmFypZxr";
        const submitBtn = document.getElementById('submit-btn');

        document.getElementById('application-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const age = document.getElementById('age').value;
            const realName = document.getElementById('realName').value;
            const sampHours = document.getElementById('sampHours').value;
            const rpExperience = document.getElementById('rpExperience').value;
            const charName = document.getElementById('charName').value;
            const charStory = document.getElementById('charStory').value;
            const whyJoin = document.getElementById('whyJoin').value;
            const discordTag = document.getElementById('discordTag').value;

            const payload = {
                username: "Lag City RP - Application Bot",
                avatar_url: "https://i.imgur.com/AfFp7pu.png",
                embeds: [
                    {
                        title: "📝 تقديم جديد - Lag City RP",
                        color: 14692400,
                        fields: [
                            { name: "👤 الاسم الحقيقي", value: realName, inline: true },
                            { name: "🎂 العمر", value: age, inline: true },
                            { name: "🎮 ديسكورد", value: discordTag, inline: true },
                            { name: "🎭 اسم الشخصية", value: charName, inline: true },
                            { name: "⏱️ ساعات SAMP", value: sampHours, inline: true },
                            { name: "🎲 خبرة رول بلاي", value: rpExperience, inline: true },
                            { name: "📖 قصة الشخصية", value: charStory },
                            { name: "❓ لماذا يريد الانضمام؟", value: whyJoin }
                        ],
                        timestamp: new Date().toISOString()
                    }
                ]
            };

            submitBtn.textContent = "جاري الإرسال...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ تم إرسال طلبك بنجاح إلى إدارة Lag City RP!");
                    window.location.reload();
                } else {
                    alert("❌ حدث خطأ أثناء إرسال الطلب.");
                    submitBtn.textContent = "إرسال الطلب إلى Lag City RP";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert("❌ فشل الاتصال بالديسكورد.");
                submitBtn.textContent = "إرسال الطلب إلى Lag City RP";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
